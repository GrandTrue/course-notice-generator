name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify static site
        run: |
          test -s index.html
          test -s style.css
          test -s script.js
          test -s fonts/NotoSansTC-Variable.woff2
          test -s fonts/NotoSerifTC-Variable.woff2
          test -s fonts/sans.data.js
          test -s fonts/serif.data.js
          test -s fonts/OFL-Noto-Sans-TC.txt
          test -s fonts/OFL-Noto-Serif-TC.txt
          grep -q 'style.css?v=' index.html
          grep -q 'script.js?v=' index.html

      - name: Prepare public files
        run: |
          mkdir _site
          cp index.html style.css script.js _site/
          cp -r fonts _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
